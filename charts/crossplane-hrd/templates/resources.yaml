{{- define "render-component" -}}
{{- $parent := .parent | default (dict) -}}
{{- $parentName := $parent.name | default "" -}}
{{- $kind := .kind -}}
{{- $apiVersion := .apiVersion -}}
{{- $refKey := .refKey | default (printf "%sIdRef" (lower $kind)) -}}
{{- $refFrom := .refFrom | default "" -}}
{{- $appendName := .appendName | default false }}
{{- $path := .path -}}

{{- if not (kindIs "string" $refFrom) -}}
  {{- fail (printf "%s.refFrom must be a string, e.g. path" $path) -}}
{{- end -}}
{{- if and $refFrom (not .refKey) -}}
  {{- fail (printf "%s.refFrom requires refKey, e.g. refKey: namespace" $path) -}}
{{- end -}}

{{- /* Settings (providerConfigRef, namespace, labels, annotations, spec) this level starts from */ -}}
{{- $base := .settings | default dict -}}

{{- /* References to all ancestors, keyed by refKey, with the values to render */ -}}
{{- $references := .references | default dict -}}

{{- $list := .list }}


{{- if kindIs "slice" $list }}
  {{- $convertedList := dict }}
  {{- range $i, $item := $list }}
    {{- $key := printf "item-%d" $i }}
    {{- $name := $item }}
    {{- $_ := set $convertedList $name (dict "forProvider" dict) }}
  {{- end }}
  {{- $list = $convertedList }}
{{- end }}



{{- range $name, $config := $list }}
{{- $config = $config | default dict }}
{{- $resourcePath := printf "%s.list.%s" $path $name }}

{{- /* Resource settings: inherited base overridden by the resource's own values */}}
{{- $settings := deepCopy $base }}
{{- include "crossplane-hrd.applySettings" (dict "dst" $settings "src" $config "path" $resourcePath) }}

{{- $inherit := false }}
{{- if not (kindIs "invalid" $config.inherit) }}
  {{- if not (kindIs "bool" $config.inherit) }}
    {{- fail (printf "%s.inherit must be true or false" $resourcePath) }}
  {{- end }}
  {{- $inherit = $config.inherit }}
{{- end }}
---
apiVersion: {{ $apiVersion }}
kind: {{ $kind }}
metadata:
  name: {{ trimPrefix "-" (printf "%s-%s-%s" $parentName (kebabcase $name) (lower $kind)) }}
  {{- with $settings.namespace }}
  namespace: {{ . }}
  {{- end }}
  {{- with $settings.labels }}
  labels: {{- include "crossplane-hrd.stringMap" . | nindent 4 }}
  {{- end }}
  {{- with $settings.annotations }}
  annotations: {{- include "crossplane-hrd.stringMap" . | nindent 4 }}
  {{- end }}
{{- $spec := deepCopy ($settings.spec | default dict) }}
{{- with $settings.providerConfigRef }}
  {{- $_ := set $spec "providerConfigRef" . }}
{{- end }}
spec:
  {{- with $spec }}
  {{- toYaml . | nindent 2 }}
  {{- end }}

  {{- $forProvider := deepCopy ($config.forProvider | default dict) }}
  {{- if $appendName }}
    {{- $_ := set $forProvider "name" $name }}
  {{- end }}
  {{- range $key, $value := $references }}
    {{- $_ := set $forProvider $key $value }}
  {{- end }}

  {{- if $forProvider }}
  forProvider:  {{ toYaml $forProvider | nindent 4 }}
  {{- else }}
  forProvider: {}
  {{- end}}

{{- /* Reference dependants get to this resource: {name: <name>}, or forProvider.<refFrom> as is */}}
{{- $childReferences := deepCopy $references }}
{{- if $refFrom }}
  {{- if or (not (hasKey $forProvider $refFrom)) (kindIs "invalid" (get $forProvider $refFrom)) }}
    {{- fail (printf "%s.forProvider.%s is required by %s.refFrom" $resourcePath $refFrom $path) }}
  {{- end }}
  {{- $_ := set $childReferences $refKey (get $forProvider $refFrom) }}
{{- else }}
  {{- $_ := set $childReferences $refKey (dict "name" (kebabcase (trimPrefix "-" (printf "%s-%s-%s" $parentName $name (lower $kind))))) }}
{{- end }}

{{- /* render dependants, passing this resource's settings down only when inherit is enabled */}}
{{- $childSettings := ternary $settings $base $inherit }}
{{- $dependants := $config.dependants | default dict }}
  {{- range $childKind, $childConfig := $dependants }}
{{ include "render-component" (dict "kind" $childKind "apiVersion" ($childConfig.apiVersion | default $apiVersion) "refKey" $childConfig.refKey "refFrom" $childConfig.refFrom "list" $childConfig.list "parent" (dict "name" (trimPrefix "-" (printf "%s-%s" $parentName $name))) "references" $childReferences "appendName" $childConfig.appendName "settings" $childSettings "path" (printf "%s.dependants.%s" $resourcePath $childKind)) }}
  {{- end }}
{{- end }}
{{- end }}

{{- define "render-components" -}}
{{- $values := .Values -}}

{{- /* Global settings; the deprecated top-level providerConfig is applied first so global.providerConfigRef wins */ -}}
{{- $settings := dict -}}
{{- with $values.providerConfig }}
  {{- $_ := set $settings "providerConfigRef" (dict "name" .) }}
{{- end }}
{{- include "crossplane-hrd.applySettings" (dict "dst" $settings "src" ($values.global | default dict) "path" "global") -}}

{{- range $kind, $config := $values.components -}}
{{ include "render-component" (dict "kind" $kind "apiVersion" $config.apiVersion "refKey" $config.refKey "refFrom" $config.refFrom "list" $config.list "parent" (dict) "references" (dict) "appendName" $config.appendName "settings" $settings "path" (printf "components.%s" $kind)) }}
{{- end -}}
{{- end }}

{{- include "render-components" . }}
